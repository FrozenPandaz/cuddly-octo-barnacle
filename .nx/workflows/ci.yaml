# yaml-language-server: $schema=https://snapshot.nx.app/nx-cloud/static/schemas/workflow.schema.json
name: Nx Cloud CI

on:
  pull-requests:
    event: PR
  main-pushes:
    event: PUSH
    branches: [main]

jobs:
  main:
    runs-on: linux-medium-js
    workers: 2 linux-medium-js
    steps:
      - name: Build and typecheck
        run: pnpm nx run-many -t build typecheck
